[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lol-live-capture"
version = "0.1.0"
description = "Read League of Legends pick/ban drafts live from a broadcast stream (video + caster audio) and serve them over an API and a web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.5",
  "opencv-python-headless>=5.0",
  "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
lol-live-capture = "lol_live_capture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_live_capture"]
artifacts = ["src/lol_live_capture/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
